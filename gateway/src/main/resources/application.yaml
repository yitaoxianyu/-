server:
  port: 8000
spring:
  application:
    name: short-link-gateway
  data:
    redis:
      password: 198311
      host: localhost
      port: 6379
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
    gateway:
      routes:
        - id: short-link-admin
          uri: lb://short-link-admin/api/short-link/admin/v1/**
          predicates:
            - Path=/api/short-link/admin/**
          filters:
            - name: TokenValidate
              args:
                whitePathList:
                  - /api/short-link/admin/v1/user/login
                  - /api/short-link/admin/v1/user/has-username
        - id: short-link-project
          uri: lb://short-link-project/api/short-link/v1/**
          predicates:
            - Path=/api/short-link/**
          filters:
            - name: TokenValidate

